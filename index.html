<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Переформатор карточек товаров</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel-bg: #1e1e1e;
    --panel-border: #333;
    --text: #d4d4d4;
    --text-muted: #888;
    --placeholder: #555;
    --accent: #6c5ce7;
    --accent-hover: #5b4bdb;
    --ok: #00b894;
    --ok-hover: #00a381;
    --err: #e74c3c;
    --err-hover: #c0392b;
    --tok-bracket: #808080;
    --tok-tag: #569cd6;
    --tok-attr: #9cdcfe;
    --tok-string: #ce9178;
    --tok-comment: #6a9955;
    --tok-json-key: #9cdcfe;
    --tok-json-str: #ce9178;
    --tok-json-num: #b5cea8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
  .panels { display: flex; gap: 16px; }
  .panel { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .panel label { font-weight: 600; font-size: 14px; }

  .editor {
    position: relative; flex: 1; min-height: 500px;
    border: 1px solid var(--panel-border); border-radius: 8px;
    overflow: hidden; background: var(--panel-bg);
  }
  .editor textarea, .editor pre {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; margin: 0; padding: 12px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 13px; line-height: 1.5; letter-spacing: 0;
    tab-size: 4; -moz-tab-size: 4;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word;
    border: none; outline: none;
  }
  .editor textarea {
    background: transparent; color: transparent;
    caret-color: var(--text); resize: none; z-index: 2; overflow: auto;
  }
  .editor textarea::placeholder { color: var(--placeholder); }
  .editor textarea::selection { background: rgba(108, 92, 231, 0.4); }
  .editor pre {
    z-index: 1; overflow: hidden; color: var(--text); pointer-events: none;
  }
  .editor pre code { font: inherit; color: inherit; }

  .tok-bracket { color: var(--tok-bracket); }
  .tok-tag     { color: var(--tok-tag); }
  .tok-attr    { color: var(--tok-attr); }
  .tok-string  { color: var(--tok-string); }
  .tok-comment { color: var(--tok-comment); font-style: italic; }
  .tok-json-key { color: var(--tok-json-key); }
  .tok-json-str { color: var(--tok-json-str); }
  .tok-json-num { color: var(--tok-json-num); }

  .buttons { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  button {
    padding: 10px 20px; border: none; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
    color: #fff;
  }
  .btn-primary { background: var(--accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-copy { background: var(--ok); }
  .btn-copy:hover { background: var(--ok-hover); }
  .btn-clear { background: var(--err); }
  .btn-clear:hover { background: var(--err-hover); }
  .status { font-size: 14px; color: var(--text-muted); margin-top: 8px; min-height: 20px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  @media (max-width: 768px) {
    .panels { flex-direction: column; }
    .editor { min-height: 250px; }
  }
</style>
</head>
<body>

<h1>Переформатор карточек товаров</h1>
<p class="subtitle">Вставьте HTML слева → нажмите «Переформатировать» → скопируйте результат справа</p>

<div class="panels">
  <div class="panel">
    <label for="input">Исходный HTML</label>
    <div class="editor">
      <pre aria-hidden="true"><code id="input-hl"></code></pre>
      <textarea id="input" spellcheck="false" placeholder="Вставьте сюда исходный код…"></textarea>
    </div>
  </div>
  <div class="panel">
    <label for="output">Готовый HTML</label>
    <div class="editor">
      <pre aria-hidden="true"><code id="output-hl"></code></pre>
      <textarea id="output" spellcheck="false" placeholder="Результат появится здесь…" readonly></textarea>
    </div>
  </div>
</div>

<div class="buttons">
  <button class="btn-primary" onclick="run()">Переформатировать</button>
  <button class="btn-copy" onclick="copyOutput()">Скопировать результат</button>
  <button class="btn-clear" onclick="clearAll()">Очистить</button>
</div>

<div class="status" id="status"></div>

<script>
/* =========================================================
   1. Подсветка (HTML + JSON + комментарии)
   ========================================================= */

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightAttrs(attrs) {
  var out = '';
  var re = /(\s+)([a-zA-Z_][\w:-]*)(\s*=\s*)("[^"]*")?/g;
  var last = 0, m;
  while ((m = re.exec(attrs)) !== null) {
    out += esc(attrs.slice(last, m.index));
    out += esc(m[1]);
    out += '<span class="tok-attr">' + esc(m[2]) + '</span>';
    if (m[3]) out += '<span class="tok-bracket">' + esc(m[3]) + '</span>';
    if (m[4]) out += '<span class="tok-string">' + esc(m[4]) + '</span>';
    last = re.lastIndex;
  }
  out += esc(attrs.slice(last));
  return out;
}

function highlightTag(tag) {
  var m = /^(<\/?)([a-zA-Z][\w:-]*)([\s\S]*?)(\/?>)$/.exec(tag);
  if (!m) return esc(tag);
  return '<span class="tok-bracket">' + esc(m[1]) + '</span>' +
         '<span class="tok-tag">' + esc(m[2]) + '</span>' +
         highlightAttrs(m[3]) +
         '<span class="tok-bracket">' + esc(m[4]) + '</span>';
}

function highlightJson(json) {
  var out = '';
  var re = /"(?:\\.|[^"\\])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?/g;
  var last = 0, m;
  while ((m = re.exec(json)) !== null) {
    out += esc(json.slice(last, m.index));
    var tok = m[0];
    var cls;
    if (tok.charAt(0) === '"') {
      cls = m[1] ? 'tok-json-key' : 'tok-json-str';
    } else if (/^(true|false|null)$/.test(tok)) {
      cls = 'tok-json-num';
    } else {
      cls = 'tok-json-num';
    }
    out += '<span class="' + cls + '">' + esc(tok) + '</span>';
    last = re.lastIndex;
  }
  out += esc(json.slice(last));
  return out;
}

function highlight(code) {
  var out = '';
  var i = 0, n = code.length;
  while (i < n) {
    // XML-комментарий
    if (code.substr(i, 4) === '<!--') {
      var end = code.indexOf('-->', i);
      end = end === -1 ? n : end + 3;
      out += '<span class="tok-comment">' + esc(code.slice(i, end)) + '</span>';
      i = end;
      continue;
    }
    // JSON-блок (начинается с { на своей строке или с { после пробелов)
    if (code[i] === '{' && (i === 0 || /[\s\n]/.test(code[i - 1]))) {
      var depth = 0, j = i, inStr = false, esc_ = false;
      for (; j < n; j++) {
        var ch = code[j];
        if (inStr) {
          if (esc_) { esc_ = false; continue; }
          if (ch === '\\') { esc_ = true; continue; }
          if (ch === '"') { inStr = false; }
        } else {
          if (ch === '"') inStr = true;
          else if (ch === '{') depth++;
          else if (ch === '}') { depth--; if (depth === 0) { j++; break; } }
        }
      }
      if (depth === 0) {
        out += highlightJson(code.slice(i, j));
        i = j;
        continue;
      }
    }
    // Тег
    if (code[i] === '<') {
      var gt = code.indexOf('>', i);
      if (gt === -1) { out += esc(code.slice(i)); break; }
      out += highlightTag(code.slice(i, gt + 1));
      i = gt + 1;
      continue;
    }
    // Обычный текст
    var next = code.indexOf('<', i);
    var nextBrace = code.indexOf('{', i);
    if (nextBrace !== -1 && (next === -1 || nextBrace < next)) next = nextBrace;
    if (next === -1) next = n;
    out += esc(code.slice(i, next));
    i = next;
  }
  return out;
}

/* =========================================================
   2. Overlay редактор
   ========================================================= */

function attachEditor(textareaId, hlCodeId) {
  var ta = document.getElementById(textareaId);
  var pre = ta.previousElementSibling;
  var code = document.getElementById(hlCodeId);

  function refresh() { code.innerHTML = highlight(ta.value); }
  function syncScroll() { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; }

  ta.addEventListener('input', refresh);
  ta.addEventListener('scroll', syncScroll);
  refresh();

  return { ta: ta, refresh: refresh };
}

var inputEditor, outputEditor;
document.addEventListener('DOMContentLoaded', function () {
  inputEditor = attachEditor('input', 'input-hl');
  outputEditor = attachEditor('output', 'output-hl');
});

/* =========================================================
   3. Утилиты
   ========================================================= */

function stripTags(html) {
  return html.replace(/<[^>]+>/g, '');
}

function escapeJson(s) {
  return s
    .replace(/\\/g, '\\\\')
    .replace(/"/g, '\\"')
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\t/g, '\\t');
}

function capitalizeFirst(s) {
  if (!s) return s;
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* Первый «не-буквенный, не-цифровой, не-пробельный» символ(ы) — считаем эмодзи */
function extractIconAndText(text) {
  text = text.trim();
  var m = /^([^\p{L}\p{N}\s]+)\s*(.*)$/u.exec(text);
  if (m) return { icon: m[1], text: (m[2] || '').trim() };
  return null;
}

/* =========================================================
   4. Карточки товаров
   ========================================================= */

var CARD_REGEX = /<image\s+src="([^"]*)"\s*><\/image>\s*<h3\b[^>]*>([\s\S]*?)<\/h3>\s*([\s\S]*?)<p\s+grade="primary"\s*>\s*<a\s+([^>]*)>([\s\S]*?)<\/a>\s*<\/p>/g;

function parseHrefOnly(attrs) {
  var m = /^\s*href="([^"]*)"\s*$/.exec(attrs);
  return m ? m[1] : null;
}

function extractDescription(middle) {
  var pRegex = /<p\s+grade="primary"\s*>([\s\S]*?)<\/p>/g;
  var paragraphs = [];
  var lastIdx = 0, cleaned = '', pm;
  while ((pm = pRegex.exec(middle)) !== null) {
    cleaned += middle.slice(lastIdx, pm.index);
    paragraphs.push(pm[1].trim());
    lastIdx = pRegex.lastIndex;
  }
  cleaned += middle.slice(lastIdx);
  return { paragraphs: paragraphs, hasGarbage: cleaned.replace(/\s+/g, '').length > 0 };
}

function cleanLeftover(text) {
  var s = text;
  s = s.replace(
    /<p\s+grade="primary"\s*>\s*<coloration[^>]*>\s*КАРТОЧК[ИА]\s+ТОВАР\w*\s*<\/coloration>\s*<\/p>/g, '');
  s = s.replace(
    /<p\s+grade="primary"\s*>\s*Картинка\s*\(ставит фоторедактор\)\s*<\/p>/g, '');
  return s.replace(/\s+/g, '');
}

function renderNoDescCard(c) {
  return [
    '<product-card>',
    '    <image src="' + c.src + '" />',
    '    <title>' + c.title + '</title>',
    '    <price link-shop="' + c.link + '">' + c.price + '</price>',
    '</product-card>'
  ].join('\n');
}

function renderDescCard(c) {
  var lines = [
    '<product-card>',
    '    <image src="' + c.src + '"></image>',
    '    <title>' + c.title + '</title>',
    '    <description>'
  ];
  for (var i = 0; i < c.description.length; i++) {
    lines.push('        <p>' + c.description[i] + '</p>');
  }
  lines.push('    </description>');
  lines.push('    <price link-shop="' + c.link + '">' + c.price + '</price>');
  lines.push('</product-card>');
  return lines.join('\n');
}

function renderGrid(cards) {
  var lines = ['<product-card-grid>'];
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    lines.push('');
    lines.push('    <product-card>');
    lines.push('        <image src="' + c.src + '" />');
    lines.push('        <title>' + c.title + '</title>');
    lines.push('        <price link-shop="' + c.link + '">' + c.price + '</price>');
    lines.push('    </product-card>');
  }
  lines.push('</product-card-grid>');
  return lines.join('\n');
}

function renderNoDescBuffer(cards) {
  if (cards.length === 1) return renderNoDescCard(cards[0]);
  if (cards.length % 2 === 0) return renderGrid(cards);
  return renderGrid(cards.slice(0, -1)) + '\n\n' + renderNoDescCard(cards[cards.length - 1]);
}

function buildProductCards(cards) {
  var blocks = [], noDescBuffer = [];
  for (var i = 0; i < cards.length; i++) {
    var c = cards[i];
    if (c.description.length > 0) {
      if (noDescBuffer.length > 0) {
        blocks.push(renderNoDescBuffer(noDescBuffer));
        noDescBuffer = [];
      }
      blocks.push(renderDescCard(c));
    } else {
      noDescBuffer.push(c);
    }
  }
  if (noDescBuffer.length > 0) blocks.push(renderNoDescBuffer(noDescBuffer));
  return blocks.join('\n\n');
}

function processHlContent(content) {
  var cards = [], m;
  CARD_REGEX.lastIndex = 0;
  while ((m = CARD_REGEX.exec(content)) !== null) {
    var link = parseHrefOnly(m[4]);
    if (link === null) continue;
    var desc = extractDescription(m[3]);
    if (desc.hasGarbage) continue;
    cards.push({
      start: m.index, end: CARD_REGEX.lastIndex,
      src: m[1], title: m[2].trim(),
      description: desc.paragraphs,
      link: link, price: m[5].trim()
    });
  }

  var leftover = '', pos = 0;
  for (var i = 0; i < cards.length; i++) {
    leftover += content.slice(pos, cards[i].start);
    pos = cards[i].end;
  }
  leftover += content.slice(pos);

  var hasMarker = /КАРТОЧК[ИА]\s+ТОВАР/.test(content);
  var hasUnrecognized = cleanLeftover(leftover).length > 0;

  if (cards.length === 0) {
    if (hasMarker) {
      var srcMatch = content.match(/<image\s+src="([^"]*)"/);
      var hint = srcMatch ? ' (image src="' + srcMatch[1] + '")' : '';
      return {
        output: null,
        comment: 'НЕ РАСПОЗНАНО: <hl> с карточками' + hint +
                 ' — не удалось собрать ни одной карточки'
      };
    }
    return null;
  }

  var builtOutput = buildProductCards(cards);
  var comment = hasUnrecognized
    ? 'НЕ РАСПОЗНАНО: часть содержимого <hl> не распознана как карточки'
    : null;
  return { output: builtOutput, comment: comment };
}

function processProductsPass(input) {
  return input.replace(/<hl>([\s\S]*?)<\/hl>/g, function (match, content) {
    var result = processHlContent(content);
    if (!result) return match;
    var out = result.output === null ? match : result.output;
    return result.comment ? '<!-- ' + result.comment + ' -->\n\n' + out : out;
  });
}

/* =========================================================
   5. Опросы → JSON
   ========================================================= */

var SURVEY_MARKER_RE = /<coloration[^>]*>[^<]*?(?:добавить|поставить|сделать|добавь)[^<]*?опрос[^<]*?<\/coloration>/gi;

function findEnclosingP(text, pos) {
  var pStart = text.lastIndexOf('<p', pos);
  if (pStart === -1) return null;
  var pEnd = text.indexOf('</p>', pos);
  if (pEnd === -1) return null;
  return { start: pStart, end: pEnd + 4 };
}

function buildSurveyJson(question, answers) {
  var lines = [];
  lines.push('{');
  lines.push('  "mode": "percent",');
  lines.push('  "answers": [');
  for (var i = 0; i < answers.length; i++) {
    var a = answers[i];
    lines.push('    {');
    lines.push('      "icon": "' + escapeJson(a.icon) + '",');
    lines.push('      "answer": "' + escapeJson(capitalizeFirst(a.text)) + '"');
    lines.push('    }' + (i < answers.length - 1 ? ',' : ''));
  }
  lines.push('  ],');
  lines.push('  "question": "' + escapeJson(question) + '",');
  lines.push('  "needLogin": true');
  lines.push('}');
  return lines.join('\n');
}

/* Формат A — маркер, потом вопрос и ответы отдельными <p> */
function tryProcessExpanded(input, markerP) {
  var pos = markerP.end;
  var question = null;
  var answers = [];
  var endOfBlock = pos;
  var pRe = /\s*<p([^>]*)>([\s\S]*?)<\/p>/y;

  while (true) {
    pRe.lastIndex = pos;
    var m = pRe.exec(input);
    if (!m) break;

    var content = m[2];
    var plainText = stripTags(content).trim();

    if (!plainText) {
      pos = pRe.lastIndex;
      endOfBlock = pos;
      continue;
    }

    var icon = extractIconAndText(plainText);
    if (icon) {
      answers.push({ icon: icon.icon, text: icon.text });
      pos = pRe.lastIndex;
      endOfBlock = pos;
      continue;
    }

    if (!question && /<strong/i.test(content)) {
      question = plainText;
      pos = pRe.lastIndex;
      endOfBlock = pos;
      continue;
    }

    break;
  }

  return { question: question, answers: answers, endOfBlock: endOfBlock };
}

/* Формат B — всё в одном <p>, разделитель <br /> */
function tryProcessCompact(enclosingText) {
  var innerM = /<p[^>]*>([\s\S]*?)<\/p>/.exec(enclosingText);
  if (!innerM) return null;
  var inner = innerM[1];

  var parts = inner.split(/<br\s*\/?>/i);
  var question = null;
  var answers = [];
  var hasMissingEmoji = false;

  for (var i = 0; i < parts.length; i++) {
    var part = stripTags(parts[i]).trim();
    if (!part) continue;

    // Маркер
    if (/(?:добав|постав|сдела|добавь)/i.test(part) && /опрос/i.test(part)) continue;

    // Вопрос
    var qMatch = /^(?:Заголовок\s+опроса|Вопрос)\s*:?\s*(.+)$/i.exec(part);
    if (qMatch && !question) {
      question = qMatch[1].trim();
      continue;
    }

    // Ответ
    var aMatch = /^Ответ\s*\d*\s*:?\s*(.+)$/i.exec(part);
    if (aMatch) {
      var icon = extractIconAndText(aMatch[1].trim());
      if (icon) answers.push({ icon: icon.icon, text: icon.text });
      else hasMissingEmoji = true;
      continue;
    }
  }

  return { question: question, answers: answers, hasMissingEmoji: hasMissingEmoji };
}

function processSurveysPass(input) {
  var matches = [];
  var m;
  SURVEY_MARKER_RE.lastIndex = 0;
  while ((m = SURVEY_MARKER_RE.exec(input)) !== null) {
    matches.push({ start: m.index, end: SURVEY_MARKER_RE.lastIndex });
  }

  for (var i = matches.length - 1; i >= 0; i--) {
    var mrk = matches[i];
    var enc = findEnclosingP(input, mrk.start);
    if (!enc) continue;
    if (enc.start > mrk.start || enc.end < mrk.end) continue;

    var enclosingText = input.slice(enc.start, enc.end);
    var isCompact = /<br\s*\/?>/i.test(enclosingText);

    var result, replaceStart = enc.start, replaceEnd;

    if (isCompact) {
      result = tryProcessCompact(enclosingText);
      replaceEnd = enc.end;
    } else {
      result = tryProcessExpanded(input, enc);
      replaceEnd = result.endOfBlock;
    }

    if (!result || !result.question || !result.answers || result.answers.length < 2) {
      var cmt = '<!-- НЕ РАСПОЗНАНО: опрос — не удалось собрать вопрос и ответы. Оставить как есть и уточнить у редактора -->\n\n';
      input = input.slice(0, enc.start) + cmt + input.slice(enc.start);
      continue;
    }

    if (result.hasMissingEmoji) {
      var cmt2 = '<!-- В ОПРОСЕ НЕТ ЭМОДЗИ У ЧАСТИ ОТВЕТОВ: запросить у редактора -->\n\n';
      input = input.slice(0, enc.start) + cmt2 + input.slice(enc.start);
      continue;
    }

    var json = buildSurveyJson(result.question, result.answers);
    input = input.slice(0, replaceStart) + json + input.slice(replaceEnd);
  }

  return input;
}

/* =========================================================
   6. Основной пайплайн
   ========================================================= */

function processInput(input) {
  var out = processProductsPass(input);
  out = processSurveysPass(out);
  return out;
}

/* =========================================================
   7. UI
   ========================================================= */

function run() {
  var status = document.getElementById('status');
  try {
    var result = processInput(inputEditor.ta.value);
    outputEditor.ta.value = result;
    outputEditor.refresh();
    status.textContent = '✅ Готово!';
    status.className = 'status ok';
  } catch (e) {
    status.textContent = '❌ Ошибка: ' + e.message;
    status.className = 'status err';
  }
}

function copyOutput() {
  var ta = outputEditor.ta;
  ta.select();
  try {
    document.execCommand('copy');
    var status = document.getElementById('status');
    status.textContent = '📋 Скопировано в буфер обмена';
    status.className = 'status ok';
  } catch (e) {}
  ta.blur();
}

function clearAll() {
  inputEditor.ta.value = '';
  inputEditor.refresh();
  outputEditor.ta.value = '';
  outputEditor.refresh();
  document.getElementById('status').textContent = '';
}
</script>
</body>
</html>
